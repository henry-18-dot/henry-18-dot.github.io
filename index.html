<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#e7e2d6">
  <meta name="description" content="入口：从零用 AI 上线一个网站、诗歌、与毛泽东的对话。">
  <title>入口</title>
  <style>
    :root {
      --paper: #e7e2d6;
      --ink: #20242a;
      --muted: #6d6a62;
      --line: rgba(32, 36, 42, .16);
      --accent: #9c3b2c;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      background: var(--paper);
      color: var(--ink);
      -webkit-text-size-adjust: 100%;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    main {
      min-height: 100svh;
      max-width: 720px;
      margin: 0 auto;
      padding: clamp(30px, 9vh, 104px) clamp(20px, 6vw, 44px) clamp(26px, 5vh, 48px);
      display: flex;
      flex-direction: column;
      justify-content: center;
    }
    nav { display: flex; flex-direction: column; }
    .entry {
      display: flex;
      align-items: baseline;
      gap: 16px;
      padding: clamp(18px, 3.4vh, 30px) 2px;
      border-top: 1px solid var(--line);
      text-decoration: none;
      color: inherit;
    }
    .entry:last-child { border-bottom: 1px solid var(--line); }
    .no {
      flex: none;
      width: 2.4em;
      color: var(--accent);
      font: 600 13px/1 ui-monospace, "Cascadia Mono", Consolas, monospace;
      letter-spacing: .06em;
    }
    .txt { display: flex; flex-direction: column; gap: 7px; flex: 1; min-width: 0; }
    .t {
      font-family: "Noto Serif CJK SC", "Source Han Serif SC", SimSun, serif;
      font-size: clamp(23px, 4.4vw, 38px);
      line-height: 1.28;
      letter-spacing: -.01em;
    }
    .d { color: var(--muted); font-size: clamp(13px, 1.6vw, 15px); line-height: 1.6; }
    .chev { flex: none; color: var(--muted); font-size: 17px; transition: transform .18s ease, color .18s ease; }
    .entry:hover .chev, .entry:focus-visible .chev { transform: translateX(4px); color: var(--accent); }
    .entry:focus-visible { outline: 2px solid var(--accent); outline-offset: 5px; }
    footer {
      margin-top: clamp(28px, 7vh, 68px);
      color: var(--muted);
      font-size: 12px;
      letter-spacing: .04em;
    }
    @media (prefers-reduced-motion: reduce) { .chev { transition: none; } }
  </style>
</head>
<body>
  <main>
    <nav aria-label="站点入口">
      <a class="entry" href="guide/">
        <span class="no">01</span>
        <span class="txt">
          <span class="t">长文</span>
          <span class="d">从零用 AI 上线一个网站</span>
        </span>
        <span class="chev" aria-hidden="true">→</span>
      </a>
      <a class="entry" href="Affairs/诗歌/">
        <span class="no">02</span>
        <span class="txt">
          <span class="t">诗歌</span>
          <span class="d">五辑，三十首</span>
        </span>
        <span class="chev" aria-hidden="true">→</span>
      </a>
      <a class="entry" href="mao-1927/">
        <span class="no">03</span>
        <span class="txt">
          <span class="t">与毛泽东的对话</span>
          <span class="d">1927 年，湖南，一个农民来问怎么办 · 台词据史料编写</span>
        </span>
        <span class="chev" aria-hidden="true">→</span>
      </a>
    </nav>
    <footer>henry-18-dot.github.io</footer>
  </main>
</body>
</html>
