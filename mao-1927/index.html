<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ededed">
<meta name="description" content="1927 年，湖南，一个农民向毛泽东提问：我要怎么办？我将怎么办？">
<title>毛泽东（1927）</title>
<style>
  :root {
    --bg: #ededed;
    --bar: #ededed;
    --line: rgba(0, 0, 0, .08);
    --bubble: #ffffff;
    --bubble-me: #95ec69;
    --ink: #111111;
    --muted: #8a8f96;
    --accent: #b23a2e;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: #d9d9d9;
    color: var(--ink);
    -webkit-text-size-adjust: 100%;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .app {
    position: relative;
    display: flex;
    flex-direction: column;
    height: 100dvh;
    max-width: 560px;
    margin: 0 auto;
    background: var(--bg);
    overflow: hidden;
  }
  @media (min-width: 600px) {
    .app { box-shadow: 0 12px 48px rgba(0, 0, 0, .18); }
  }

  /* 顶部栏 */
  .nav {
    position: relative;
    z-index: 3;
    flex: none;
    display: flex;
    align-items: center;
    height: 48px;
    padding: 0 6px;
    background: var(--bar);
    border-bottom: 1px solid var(--line);
  }
  .back {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 40px;
    height: 40px;
    color: #222;
    text-decoration: none;
    border-radius: 8px;
  }
  .back svg { width: 11px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
  .back:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
  .nav-title {
    flex: 1;
    margin: 0;
    font-size: 17px;
    font-weight: 600;
    text-align: center;
    letter-spacing: .01em;
  }
  .nav-side { flex: none; width: 40px; }

  /* 聊天区 */
  .chat {
    flex: 1 1 auto;
    min-height: 0;
    overflow-y: auto;
    overflow-x: hidden;
    padding: 10px 0 4px;
    -webkit-overflow-scrolling: touch;
    overscroll-behavior: contain;
  }
  .row {
    display: flex;
    align-items: flex-start;
    gap: 9px;
    margin: 0 12px 16px;
  }
  .row.me { flex-direction: row-reverse; }
  .avatar {
    flex: none;
    width: 36px;
    height: 36px;
    border-radius: 4px;
    overflow: hidden;
    background: #c9ccd0;
  }
  .avatar svg { display: block; width: 100%; height: 100%; }

  .bubble {
    position: relative;
    max-width: 78%;
    padding: 9px 12px 10px;
    border-radius: 6px;
    background: var(--bubble);
    font-size: 16px;
    line-height: 1.68;
    overflow-wrap: break-word;
  }
  .bubble::before {
    content: "";
    position: absolute;
    top: 11px;
    width: 0;
    height: 0;
    border: 6px solid transparent;
  }
  .row:not(.me) .bubble::before { left: -11px; border-right-color: var(--bubble); }
  .row.me .bubble::before { right: -11px; border-left-color: var(--bubble-me); }
  .row.me .bubble { background: var(--bubble-me); }

  .bubble p { margin: 0; }
  .bubble p + p.s { margin-top: 12px; }

  /* 资料整理提示 */
  .hints { display: flex; flex-direction: column; gap: 3px; margin: 0 0 10px; }
  .hints:empty { display: none; }
  .hint {
    color: var(--muted);
    font-size: 12px;
    line-height: 1.6;
    opacity: 0;
    transform: translateY(2px);
    transition: opacity .26s ease, transform .26s ease;
  }
  .hint.in { opacity: 1; transform: none; }

  /* 上标与逐句出处 */
  sup.n {
    font-size: 10.5px;
    line-height: 0;
    vertical-align: super;
    color: var(--muted);
    letter-spacing: .02em;
    margin-left: 1px;
  }
  .cite {
    margin: 3px 0 9px;
    color: var(--muted);
    font-size: 12px;
    line-height: 1.55;
    opacity: 0;
    transform: translateY(2px);
    transition: opacity .3s ease, transform .3s ease;
  }
  .cite.in { opacity: 1; transform: none; }
  .cite .cnum { font-weight: 700; margin-right: 5px; }
  .cite a { color: inherit; text-decoration: underline; text-underline-offset: 2px; text-decoration-color: rgba(120, 128, 138, .5); }
  .cite a:hover { color: #5a6068; }

  /* 底部选择入口 */
  .composer {
    position: relative;
    z-index: 4;
    flex: none;
    padding: 7px 10px calc(7px + env(safe-area-inset-bottom));
    background: #f7f7f7;
    border-top: 1px solid var(--line);
  }
  .trigger {
    display: flex;
    align-items: center;
    gap: 9px;
    width: 100%;
    padding: 0;
    background: none;
    border: 0;
    cursor: pointer;
    font: inherit;
    color: inherit;
  }
  .trigger:disabled { cursor: default; }
  .trigger:focus-visible { outline: 2px solid #9db7d4; outline-offset: 3px; border-radius: 8px; }
  .plus {
    flex: none;
    display: flex;
    align-items: center;
    justify-content: center;
    width: 30px;
    height: 30px;
    border: 1.4px solid #6f7378;
    border-radius: 50%;
    color: #4c5055;
  }
  .plus svg { width: 15px; height: 15px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; }
  .field {
    position: relative;
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: flex-end;
    height: 38px;
    padding: 0 11px;
    border-radius: 6px;
    background: #ffffff;
  }
  .field .chev { width: 11px; height: 7px; fill: none; stroke: #8d9196; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; transition: transform .18s ease; }
  .trigger[aria-expanded="true"] .field .chev { transform: rotate(180deg); }
  .trigger[aria-expanded="true"] .plus { border-color: var(--accent); color: var(--accent); }

  .menu {
    position: absolute;
    left: 10px;
    bottom: calc(100% + 6px);
    min-width: 186px;
    padding: 2px 0;
    background: #ffffff;
    border-radius: 10px;
    box-shadow: 0 6px 26px rgba(0, 0, 0, .18);
    overflow: hidden;
  }
  .menu[hidden] { display: none; }
  .opt {
    display: flex;
    align-items: center;
    width: 100%;
    min-height: 46px;
    padding: 0 16px;
    background: #ffffff;
    border: 0;
    font: inherit;
    font-size: 16px;
    color: var(--ink);
    text-align: left;
    cursor: pointer;
    white-space: nowrap;
  }
  .opt + .opt { border-top: 1px solid #f0f0f0; }
  .opt:active { background: #f2f2f2; }
  .opt:focus-visible { outline: 2px solid #9db7d4; outline-offset: -3px; }
  .opt[aria-disabled="true"] { color: #b8bcc1; cursor: default; background: #fff; }
  .menu-note {
    margin: 0;
    padding: 9px 16px 10px;
    border-top: 1px solid #f0f0f0;
    color: #a0a4a9;
    font-size: 12px;
  }
  .menu-note[hidden] { display: none; }

  .sr-only {
    position: absolute;
    width: 1px; height: 1px;
    margin: -1px; padding: 0;
    overflow: hidden;
    clip: rect(0 0 0 0);
    white-space: nowrap;
    border: 0;
  }
  @media (prefers-reduced-motion: reduce) {
    .hint, .cite, .field .chev { transition: none; }
  }
</style>
</head>
<body>
<div class="app">
  <header class="nav">
    <a class="back" href="../index.html" aria-label="返回入口">
      <svg viewBox="0 0 11 20" aria-hidden="true"><path d="M9.5 1.5 2 10l7.5 8.5"/></svg>
    </a>
    <h1 class="nav-title">毛泽东（1927）</h1>
    <span class="nav-side" aria-hidden="true"></span>
  </header>

  <main class="chat" id="chat" aria-label="对话记录"></main>
  <p class="sr-only" id="status" role="status" aria-live="polite"></p>

  <div class="composer">
    <div class="menu" id="menu" role="listbox" aria-label="选择要说的话" hidden>
      <button class="opt" type="button" role="option" data-q="q1">我要怎么办？</button>
      <button class="opt" type="button" role="option" data-q="q2">我将怎么办？</button>
      <p class="menu-note" id="menuNote" hidden>两问都问过了。</p>
    </div>
    <button class="trigger" id="trigger" type="button" aria-haspopup="listbox" aria-expanded="false"
            aria-controls="menu" aria-label="选择要说的话">
      <span class="plus" aria-hidden="true">
        <svg viewBox="0 0 15 15"><path d="M7.5 2v11M2 7.5h11"/></svg>
      </span>
      <span class="field" aria-hidden="true">
        <svg class="chev" viewBox="0 0 11 7"><path d="M1 6 5.5 1.5 10 6"/></svg>
      </span>
    </button>
  </div>
</div>

<script>
(function () {
  "use strict";

  /* ---------- 文献 ---------- */
  var SOURCES = {
    1: {
      text: "毛泽东《湖南农民运动考察报告》，1927 年 3 月",
      url: "https://www.marxists.org/chinese/maozedong/marxist.org-chinese-mao-192703.htm"
    },
    2: {
      text: "马克思《路易·波拿巴的雾月十八日》，1852 年，第七节",
      url: "https://www.marxists.org/chinese/marx-engels/08/003.htm"
    },
    3: {
      text: "J. C. 斯科特《农民的道义经济学：东南亚的反叛与生存》，耶鲁大学出版社 1976 年，第六章",
      url: "https://archive.org/details/scott-james.-the-moral-economy-of-the-peasant"
    },
    4: {
      text: "毛泽东《关于领导方法的若干问题》，1943 年 6 月 1 日，第（四）条",
      url: "https://www.marxists.org/chinese/maozedong/marxist.org-chinese-mao-19430601.htm"
    },
    5: {
      text: "毛泽东《为人民服务》，1944 年 9 月 8 日，第三段",
      url: "https://www.marxists.org/chinese/maozedong/marxist.org-chinese-mao-19440908.htm"
    },
    6: {
      text: "黄炎培《延安归来》，1945 年；人民政协报引述",
      url: "https://www.rmzxw.com.cn/c/2026-09-01/3968863.shtml"
    },
    7: {
      text: "毛泽东《整顿党的作风》，1942 年 2 月 1 日，末段",
      url: "https://www.marxists.org/chinese/maozedong/marxist.org-chinese-mao-19420201.htm"
    }
  };

  /* ---------- 两问的固定回答 ----------
     segments: 一句话一条
       parts:  [{ t: 文字, n: [上标编号…] }]
       cites:  [{ n: 编号, kind: "直接引文" | "观点概括" }]
     台词是依据史料编写的角色扮演，不是原始发言。 */
  var QA = {
    q1: {
      question: "我要怎么办？",
      hints: [
        "资料整理 · 农会与乡村公共事务 ——《湖南农民运动考察报告》，1927",
        "资料整理 · 分散的小农与联合起来 ——《路易·波拿巴的雾月十八日》，1852",
        "资料整理 · 生存伦理与反抗的正当性 ——《农民的道义经济学》，1976"
      ],
      segments: [
        { parts: [{ t: "坐下，慢慢说。苛捐、杂税、团防保甲——一样一样，都压在你头上。", n: [1] }],
          cites: [{ n: 1, loc: "第四件「推翻土豪劣绅的封建统治——打倒都团」；第五件「推翻地主武装」；第六件「推翻县官老爷衙门差役的政权」；第十一件「废苛捐」", kind: "观点概括" }] },
        { parts: [{ t: "你们一家一户，各顾各的，力量是散的。散了，人家才敢一个一个地收拾你们。", n: [2] }],
          cites: [{ n: 2, kind: "观点概括" }] },
        { parts: [{ t: "活不下去，起来讨个说法——这不是闹事，是天经地义！", n: [3] }],
          cites: [{ n: 3, kind: "观点概括" }] },
        { parts: [{ t: "城里人说你们糟得很？我说，好得很！", n: [1] }],
          cites: [{ n: 1, loc: "“糟得很”和“好得很”", kind: "直接引文" }] },
        { parts: [{ t: "怎么办？办农会！", n: [1] }],
          cites: [{ n: 1, loc: "组织起来；第一件「将农民组织在农会里」", kind: "观点概括" }] },
        { parts: [{ t: "一个村的人站到一块，就是农会。农会一立，散沙成拳头，土豪劣绅就坐不住！", n: [1] }],
          cites: [{ n: 1, loc: "第一件「将农民组织在农会里」；第二件「政治上打击地主」", kind: "观点概括" }] },
        { parts: [{ t: "不准谷米出境！不准高抬谷价！不准囤积居奇！", n: [1] }],
          cites: [{ n: 1, loc: "第三件「经济上打击地主」", kind: "直接引文" }] },
        { parts: [{ t: "苛捐杂税，废！", n: [1] }],
          cites: [{ n: 1, loc: "第十一件「废苛捐」", kind: "观点概括" }] },
        { parts: [{ t: "塘坝要修，道路要修，夜学要办，合作社要办——村上的公事，全村人来办！", n: [1] }],
          cites: [{ n: 1, loc: "第十二件「文化运动」；第十三件「合作社运动」；第十四件「修道路，修塘坝」", kind: "观点概括" }] },
        { parts: [{ t: "革命不是请客吃饭，不是做文章……", n: [1] }],
          cites: [{ n: 1, loc: "所谓“过分”的问题", kind: "直接引文" }] },
        { parts: [{ t: "一个人做不成的事，一个农会就做得成——这就叫组织起来！", n: [1] }],
          cites: [{ n: 1, loc: "组织起来", kind: "观点概括" }] },
        { parts: [{ t: "回去，先把农会立起来。干起来！", n: [] }], cites: [] }
      ]
    },
    q2: {
      question: "我将怎么办？",
      hints: [
        "资料整理 · 对待错误的态度 ——《整顿党的作风》，1942",
        "资料整理 · 群众路线的工作方法 ——《关于领导方法的若干问题》，1943",
        "资料整理 · 接受批评与改正 ——《为人民服务》，1944",
        "资料整理 · 让人民监督政府 ——《延安归来》记毛泽东答黄炎培，1945"
      ],
      segments: [
        { parts: [{ t: "坐下。这一问，比打天下还难。", n: [] }], cites: [] },
        { parts: [{ t: "主意从哪里来？从群众中来，到群众中去！", n: [4] }],
          cites: [{ n: 4, kind: "直接引文" }] },
        { parts: [{ t: "你们定的事，办没办成、办没办对，要回头问你们——不是我在屋里说了算。", n: [4] }],
          cites: [{ n: 4, kind: "观点概括" }] },
        { parts: [{ t: "还有一条：只有让人民来监督政府，政府才不敢松懈！", n: [6] }],
          cites: [{ n: 6, kind: "直接引文（二手转述）" }] },
        { parts: [{ t: "我做得不对，你们当面讲。", n: [5] }],
          cites: [{ n: 5, kind: "观点概括" }] },
        { parts: [{ t: "不管是什么人，谁向我们指出都行——只要你说得对，我们就改正！", n: [5] }],
          cites: [{ n: 5, kind: "直接引文" }] },
        { parts: [{ t: "骂错了，也不追究！为人民服务的人，不怕别人批评指出。", n: [5] }],
          cites: [{ n: 5, kind: "观点概括" }] },
        { parts: [{ t: "错了就认，认了就改。犯了错要揭发、要讲清楚——目的是治病救人，不是一棍子把人打死。", n: [7] }],
          cites: [{ n: 7, kind: "观点概括" }] },
        { parts: [{ t: "这一条对自己也一样：改了就照着做，别叫下一回再犯一遍！", n: [7] }],
          cites: [{ n: 7, kind: "观点概括" }] },
        { parts: [{ t: "革命靠的不是一个人，是千千万万人。", n: [4] }],
          cites: [{ n: 4, kind: "观点概括" }] },
        { parts: [{ t: "记住这一条，路才走得长。就这么办。", n: [] }], cites: [] }
      ]
    }
  };

  /* ---------- DOM ---------- */
  var chat = document.getElementById("chat");
  var trigger = document.getElementById("trigger");
  var menu = document.getElementById("menu");
  var menuNote = document.getElementById("menuNote");
  var statusLine = document.getElementById("status");
  var options = Array.prototype.slice.call(menu.querySelectorAll(".opt"));

  var AVATARS = {
    left: '<svg viewBox="0 0 36 36" aria-hidden="true"><rect width="36" height="36" rx="4" fill="#b0453a"/><circle cx="18" cy="14" r="5.2" fill="#f4ece0"/><path d="M6.6 32c1.5-6.3 6-9.6 11.4-9.6S27.9 25.7 29.4 32z" fill="#f4ece0"/></svg>',
    right: '<svg viewBox="0 0 36 36" aria-hidden="true"><rect width="36" height="36" rx="4" fill="#7d8b7c"/><circle cx="18" cy="14" r="5.2" fill="#eef0ea"/><path d="M6.6 32c1.5-6.3 6-9.6 11.4-9.6S27.9 25.7 29.4 32z" fill="#eef0ea"/></svg>'
  };

  var busy = false;
  var asked = Object.create(null);

  function el(tag, cls, text) {
    var node = document.createElement(tag);
    if (cls) node.className = cls;
    if (text != null) node.textContent = text;
    return node;
  }

  function sleep(ms) {
    return new Promise(function (resolve) { setTimeout(resolve, ms); });
  }

  function scrollBottom() {
    chat.scrollTop = chat.scrollHeight;
  }

  function makeRow(side) {
    var row = el("div", "row" + (side === "me" ? " me" : ""));
    var avatar = el("div", "avatar");
    avatar.innerHTML = AVATARS[side === "me" ? "right" : "left"];
    var bubble = el("div", "bubble");
    row.appendChild(avatar);
    row.appendChild(bubble);
    chat.appendChild(row);
    scrollBottom();
    return bubble;
  }

  function addUserLine(text) {
    var bubble = makeRow("me");
    bubble.appendChild(el("p", null, text));
    return bubble;
  }

  function makeSup(n) {
    var sup = document.createElement("sup");
    sup.className = "n";
    sup.dataset.n = String(n);
    sup.textContent = String(n);
    return sup;
  }

  function makeCite(cite) {
    var src = SOURCES[cite.n];
    var line = el("p", "cite");
    line.dataset.n = String(cite.n);
    line.appendChild(el("span", "cnum", cite.n + " ·"));
    var link = document.createElement("a");
    link.href = src.url;
    link.target = "_blank";
    link.rel = "noopener noreferrer";
    link.textContent = src.text;
    line.appendChild(link);
    if (cite.loc) line.appendChild(document.createTextNode("，" + cite.loc));
    line.appendChild(document.createTextNode(" · " + cite.kind));
    return line;
  }

  async function typeInto(node, text, speed) {
    for (var i = 0; i < text.length; i++) {
      node.textContent += text.charAt(i);
      if (i % 3 === 0) scrollBottom();
      await sleep(speed);
    }
  }

  function setBusy(value) {
    busy = value;
    trigger.disabled = value;
    menu.setAttribute("aria-busy", value ? "true" : "false");
    if (value) closeMenu();
  }

  function setOptionState() {
    var done = 0;
    options.forEach(function (btn) {
      if (asked[btn.dataset.q]) {
        btn.setAttribute("aria-disabled", "true");
        done++;
      } else {
        btn.removeAttribute("aria-disabled");
      }
    });
    if (done === options.length) {
      menuNote.hidden = false;
    } else {
      menuNote.hidden = true;
    }
  }

  function openMenu() {
    if (busy) return;
    setOptionState();
    menu.hidden = false;
    trigger.setAttribute("aria-expanded", "true");
  }

  function closeMenu() {
    menu.hidden = true;
    trigger.setAttribute("aria-expanded", "false");
  }

  async function play(qid) {
    if (busy || asked[qid]) return;
    var cfg = QA[qid];
    setBusy(true);
    closeMenu();

    addUserLine(cfg.question);

    var bubble = makeRow("bot");
    var hints = el("div", "hints");
    bubble.appendChild(hints);

    for (var h = 0; h < cfg.hints.length; h++) {
      await sleep(h === 0 ? 420 : 520);
      var hint = el("span", "hint", cfg.hints[h]);
      hints.appendChild(hint);
      scrollBottom();
      requestAnimationFrame(function () { hint.classList.add("in"); });
    }
    await sleep(460);

    for (var s = 0; s < cfg.segments.length; s++) {
      var seg = cfg.segments[s];
      var p = el("p", "s");
      bubble.appendChild(p);
      var marks = [];
      for (var q = 0; q < seg.parts.length; q++) {
        var part = seg.parts[q];
        var span = el("span");
        p.appendChild(span);
        await typeInto(span, part.t, 18);
        marks = marks.concat(part.n || []);
      }
      /* 上标与它对应的出处行在同一帧出现，避免先见数字后见文献 */
      for (var k = 0; k < marks.length; k++) {
        p.appendChild(document.createTextNode("\u2060")); /* 词连接符：不让上标被折到下一行 */
        p.appendChild(makeSup(marks[k]));
      }
      var fresh = [];
      for (var c = 0; c < seg.cites.length; c++) {
        var line = makeCite(seg.cites[c]);
        bubble.appendChild(line);
        fresh.push(line);
      }
      scrollBottom();
      requestAnimationFrame(function (nodes) {
        return function () {
          for (var i = 0; i < nodes.length; i++) nodes[i].classList.add("in");
        };
      }(fresh));
      await sleep(150);
    }

    asked[qid] = true;
    bubble.dataset.done = "1";
    setBusy(false);
    setOptionState();
    closeMenu();
    statusLine.textContent = "回答结束";
  }

  /* ---------- 事件 ---------- */
  trigger.addEventListener("click", function () {
    if (busy) return;
    if (menu.hidden) openMenu(); else closeMenu();
  });

  menu.addEventListener("click", function (event) {
    var btn = event.target.closest(".opt");
    if (!btn || busy) return;
    if (btn.getAttribute("aria-disabled") === "true") return;
    play(btn.dataset.q);
  });

  document.addEventListener("click", function (event) {
    if (menu.hidden) return;
    if (event.target.closest(".composer")) return;
    closeMenu();
  });

  document.addEventListener("keydown", function (event) {
    if (event.key === "Escape" && !menu.hidden) {
      closeMenu();
      trigger.focus();
    }
  });

  options.forEach(function (btn) {
    btn.addEventListener("click", function (event) {
      if (btn.getAttribute("aria-disabled") === "true") event.preventDefault();
    });
  });
})();
</script>
</body>
</html>
