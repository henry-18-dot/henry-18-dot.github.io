<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="color-scheme" content="light"><title>2 · Goodnight</title><link rel="stylesheet" href="../../../style.css"></head><body class="note"><div class="app"><nav aria-label="返回上级"><a class="back" href="index.html"><svg viewBox="0 0 16 28" aria-hidden="true"><path d="M13 3 3 14l10 11"/></svg>Clivia</a></nav><main><article aria-label="Goodnight"><h1>2</h1><p class="poem-title">Goodnight</p><p>带着黄昏的记忆，猫头鹰在夜晚醒来。</p><p>今天要去的地方很远很远。</p><p>出发前得再告诉自己一次，自己不是什么朝生暮死的鸟。</p><p>但为什么自己还害怕，早晨的杀戮？</p></article></main></div></body></html>
