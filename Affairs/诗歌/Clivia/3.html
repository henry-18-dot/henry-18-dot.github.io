<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="color-scheme" content="light"><title>3 · Torches</title><link rel="stylesheet" href="../../../style.css"></head><body class="note"><div class="app"><nav aria-label="返回上级"><a class="back" href="index.html"><svg viewBox="0 0 16 28" aria-hidden="true"><path d="M13 3 3 14l10 11"/></svg>Clivia</a></nav><main><article aria-label="Torches"><h1>3</h1><p class="poem-title">Torches</p><p>背上背包，登上火车。</p><p>攥着火把别说话。</p><p>杀了男主人，强奸女主人。</p><p>最后烧了这个地方。</p></article></main></div></body></html>
