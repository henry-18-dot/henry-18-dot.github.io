<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="color-scheme" content="light"><title>4 · Caffeine</title><link rel="stylesheet" href="../../../style.css"></head><body class="note"><div class="app"><nav aria-label="返回上级"><a class="back" href="index.html"><svg viewBox="0 0 16 28" aria-hidden="true"><path d="M13 3 3 14l10 11"/></svg>Clivia</a></nav><main><article aria-label="Caffeine"><h1>4</h1><p class="poem-title">Caffeine</p><p>仅在这篇，我要告诫你</p><p>如果你服用了兴奋剂，感觉自己能力增强，生活更美好</p><p>那是因为你本来就有基础。并非所有功劳都来自兴奋剂。</p><p>更不要妄自菲薄。</p></article></main></div></body></html>
