<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="color-scheme" content="light"><title>5 · Shirts</title><link rel="stylesheet" href="../../../style.css"></head><body class="note"><div class="app"><nav aria-label="返回上级"><a class="back" href="index.html"><svg viewBox="0 0 16 28" aria-hidden="true"><path d="M13 3 3 14l10 11"/></svg>Clivia</a></nav><main><article aria-label="Shirts"><h1>5</h1><p class="poem-title">Shirts</p><p>风吹过河岸，天凉了下来，河面上的船只都归了港。</p><p>我们紧靠着，透过不同颜色的衬衫传递着彼此的体温。</p><p>吹过的风，传来了草木、棉花和咖啡渍的坚果香味。</p><p>然后彻底降温了。🥶只剩你的肩膀</p></article></main></div></body></html>
