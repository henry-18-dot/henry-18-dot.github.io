<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="color-scheme" content="light"><title>6 · Farewell</title><link rel="stylesheet" href="../../../style.css"></head><body class="note"><div class="app"><nav aria-label="返回上级"><a class="back" href="index.html"><svg viewBox="0 0 16 28" aria-hidden="true"><path d="M13 3 3 14l10 11"/></svg>Clivia</a></nav><main><article aria-label="Farewell"><h1>6</h1><p class="poem-title">Farewell</p><p>亲爱的读者，如果你读到这里，那么请接受我衷心的感谢。在这里， Clivia 章节结束了。</p><p>很多事情就是这样。你知道它会结束，但往往只有在接触它的时候，才能明白，它在被接触的时候，就已经结束了。</p><p>…那就有读者要钻牛角尖了啊，说我这是耍赖。</p><p>你还指望我说什么？继续往后读吧。抱歉上面那段文字太复杂了。</p></article></main></div></body></html>
