<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="color-scheme" content="light"><title>6 · Fever</title><link rel="stylesheet" href="../../../style.css"></head><body class="note"><div class="app"><nav aria-label="返回上级"><a class="back" href="index.html"><svg viewBox="0 0 16 28" aria-hidden="true"><path d="M13 3 3 14l10 11"/></svg>Redundancy</a></nav><main><article aria-label="Fever"><h1>6</h1><p class="poem-title">Fever</p><p>咖啡因，缺少睡眠 工程知识、英语、政治思想、学习方法</p><p>时不时会让我觉得天旋地转</p><p>但我依然，背起书包，在夕阳下前进。</p><p>我内心里有温柔的力量。并，迫不及待晚上再见到它们</p></article></main></div></body></html>
