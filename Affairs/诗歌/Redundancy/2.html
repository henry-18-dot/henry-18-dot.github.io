<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="color-scheme" content="light"><title>2 · Nameless</title><link rel="stylesheet" href="../../../style.css"></head><body class="note"><div class="app"><nav aria-label="返回上级"><a class="back" href="index.html"><svg viewBox="0 0 16 28" aria-hidden="true"><path d="M13 3 3 14l10 11"/></svg>Redundancy</a></nav><main><article aria-label="Nameless"><h1>2</h1><p class="poem-title">Nameless</p><p>于是我累了，打开电视机</p><p>穿堂而过的山鹰从一片竹林飞往另一片竹林。</p><p>我努力不去想竹林里到底有什么</p><p>可身体已经一跃而下。自由，自由</p></article></main></div></body></html>
