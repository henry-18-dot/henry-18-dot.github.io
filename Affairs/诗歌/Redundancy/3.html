<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="color-scheme" content="light"><title>3 · Morrow</title><link rel="stylesheet" href="../../../style.css"></head><body class="note"><div class="app"><nav aria-label="返回上级"><a class="back" href="index.html"><svg viewBox="0 0 16 28" aria-hidden="true"><path d="M13 3 3 14l10 11"/></svg>Redundancy</a></nav><main><article aria-label="Morrow"><h1>3</h1><p class="poem-title">Morrow</p><p>一夜无梦，凌晨 5 点的车道上满是积雪。</p><p>我慢跑着</p><p>上了天桥，上了跑道</p><p>在每个可以回头的地方打消了回头的念头</p></article></main></div></body></html>
