<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="color-scheme" content="light"><title>1 · Determination</title><link rel="stylesheet" href="../../../style.css"></head><body class="note"><div class="app"><nav aria-label="返回上级"><a class="back" href="index.html"><svg viewBox="0 0 16 28" aria-hidden="true"><path d="M13 3 3 14l10 11"/></svg>Redundancy</a></nav><main><article aria-label="Determination"><h1>1</h1><p class="poem-title">Determination</p><p>乘坐地铁，穿过有金麻雀雕像的火车站</p><p>登上扶梯，遥望城市丛林里刚被建成的卡通风印加建筑</p><p>与我同行的两位女生已经下车，万向轮机器人也在飞跃高楼的冒险中失联</p><p>我扒开眼罩，爬起身来，饥肠辘辘。不禁庆幸今天又是美好的一天。</p></article></main></div></body></html>
