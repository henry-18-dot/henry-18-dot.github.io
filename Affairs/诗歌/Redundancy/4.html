<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="color-scheme" content="light"><title>4 · Flashlight</title><link rel="stylesheet" href="../../../style.css"></head><body class="note"><div class="app"><nav aria-label="返回上级"><a class="back" href="index.html"><svg viewBox="0 0 16 28" aria-hidden="true"><path d="M13 3 3 14l10 11"/></svg>Redundancy</a></nav><main><article aria-label="Flashlight"><h1>4</h1><p class="poem-title">Flashlight</p><p>专业的探险家在雪原上徒步</p><p>周围的灯塔数量恰到好处，让他很开心。</p><p>但在如此黑夜里行走，自己还是要备一个手电筒</p><p>…随之而来的就是黎明。探险家翻到雪山背后，希望晚点再被太阳照到</p></article></main></div></body></html>
