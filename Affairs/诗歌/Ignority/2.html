<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="color-scheme" content="light"><title>2 · Wonderland</title><link rel="stylesheet" href="../../../style.css"></head><body class="note"><div class="app"><nav aria-label="返回上级"><a class="back" href="index.html"><svg viewBox="0 0 16 28" aria-hidden="true"><path d="M13 3 3 14l10 11"/></svg>Ignority</a></nav><main><article aria-label="Wonderland"><h1>2</h1><p class="poem-title">Wonderland</p><p>温暖的怀抱，像绵密的奶油</p><p>只能听懂你说的话</p><p>左边是红；右边是黄；</p><p>每天都陪我玩。我好幸福</p></article></main></div></body></html>
