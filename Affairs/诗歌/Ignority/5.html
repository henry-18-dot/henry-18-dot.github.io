<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="color-scheme" content="light"><title>5 · Monkey</title><link rel="stylesheet" href="../../../style.css"></head><body class="note"><div class="app"><nav aria-label="返回上级"><a class="back" href="index.html"><svg viewBox="0 0 16 28" aria-hidden="true"><path d="M13 3 3 14l10 11"/></svg>Ignority</a></nav><main><article aria-label="Monkey"><h1>5</h1><p class="poem-title">Monkey</p><p>在丛林里的表演场，围坐着一排观众。在中间的猴子要决定把手中的椰子递给谁。</p><p>我做了个鬼脸。</p><p>它就走过来给我了。哈哈</p></article></main></div></body></html>
