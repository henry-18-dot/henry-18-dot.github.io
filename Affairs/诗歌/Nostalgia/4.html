<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="color-scheme" content="light"><title>4 · Shelter</title><link rel="stylesheet" href="../../../style.css"></head><body class="note"><div class="app"><nav aria-label="返回上级"><a class="back" href="index.html"><svg viewBox="0 0 16 28" aria-hidden="true"><path d="M13 3 3 14l10 11"/></svg>Nostalgia</a></nav><main><article aria-label="Shelter"><h1>4</h1><p class="poem-title">Shelter</p><p>来到一个地下避难所的医院，大厅很大，科室很多。</p><p>没人。所以我也不用困住她们</p><p>就像我上次那样。</p><p>两次都是梦啦</p></article></main></div></body></html>
