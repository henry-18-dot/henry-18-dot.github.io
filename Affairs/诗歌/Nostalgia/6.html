<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="color-scheme" content="light"><title>6 · Sport Car</title><link rel="stylesheet" href="../../../style.css"></head><body class="note"><div class="app"><nav aria-label="返回上级"><a class="back" href="index.html"><svg viewBox="0 0 16 28" aria-hidden="true"><path d="M13 3 3 14l10 11"/></svg>Nostalgia</a></nav><main><article aria-label="Sport Car"><h1>6</h1><p class="poem-title">Sport Car</p><p>角落里停着亏电的保时捷 Macan。</p><p>我曾经坐在副座，听着父亲说，你要买 4000 万的布加迪，开到更远的地方。</p><p>在那时，西不是左。也不是其他乱七八糟的。</p><p>西就是西。</p></article></main></div></body></html>
