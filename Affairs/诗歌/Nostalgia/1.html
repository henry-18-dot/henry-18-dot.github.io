<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="color-scheme" content="light"><title>1 · Sunset</title><link rel="stylesheet" href="../../../style.css"></head><body class="note"><div class="app"><nav aria-label="返回上级"><a class="back" href="index.html"><svg viewBox="0 0 16 28" aria-hidden="true"><path d="M13 3 3 14l10 11"/></svg>Nostalgia</a></nav><main><article aria-label="Sunset"><h1>1</h1><p class="poem-title">Sunset</p><p>关于那段时间，若让我回忆，我最先记起的是这个场景</p><p>白色整齐的栏杆外，稀疏的野草布满山丘，一眼望去没有城市。</p><p>不时有牛粪味飘过来</p><p>我经常倚在架子上抖腿，静静地，等待着铃声。</p></article></main></div></body></html>
