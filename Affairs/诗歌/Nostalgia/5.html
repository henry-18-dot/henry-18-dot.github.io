<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="color-scheme" content="light"><title>5 · Chocolate Bar</title><link rel="stylesheet" href="../../../style.css"></head><body class="note"><div class="app"><nav aria-label="返回上级"><a class="back" href="index.html"><svg viewBox="0 0 16 28" aria-hidden="true"><path d="M13 3 3 14l10 11"/></svg>Nostalgia</a></nav><main><article aria-label="Chocolate Bar"><h1>5</h1><p class="poem-title">Chocolate Bar</p><p>乘上一辆跟大楼无异的公交车，穿梭</p><p>车慢慢变低，来到一片灰矮的烂尾楼前</p><p>下车后，我给了那个小男孩一个橙色的橙子</p><p>他跑回屋，拿出来一片巧克力送给我。</p></article></main></div></body></html>
