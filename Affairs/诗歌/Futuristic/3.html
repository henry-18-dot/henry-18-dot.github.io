<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="color-scheme" content="light"><title>3 · Rebellion</title><link rel="stylesheet" href="../../../style.css"></head><body class="note"><div class="app"><nav aria-label="返回上级"><a class="back" href="index.html"><svg viewBox="0 0 16 28" aria-hidden="true"><path d="M13 3 3 14l10 11"/></svg>Futuristic</a></nav><main><article aria-label="Rebellion"><h1>3</h1><p class="poem-title">Rebellion</p><p>作为一个普通士兵，装配着我方精良的装备，和战友们挤坐在一起，乘着大卡车晃晃悠悠进入关押敌方士兵的工地。</p><p>道路两旁，或站或蹲着军服颜色与我方相同、但残破不堪、简陋至极的敌方士兵。</p><p>卡车驶进了水泥地大广场，周围是密不透风的水泥高墙。</p><p>在这里，叛乱发生了，周围的战友一个接一个倒下。</p><p>最后我搭上直升机逃离，嗡嗡声盖过骚乱声。挂在梯子上俯瞰时仍心有余悸。</p></article></main></div></body></html>
